<div class="page">

  <!-- 🔄 LOADING -->
  <div *ngIf="loading">
    <p>Cargando dashboard...</p>
  </div>

  <!-- TODO EL DASHBOARD SOLO CUANDO CARGA -->
  <ng-container *ngIf="!loading">

    <!-- KPI GRID -->
    <div class="kpi-grid">

      <div class="kpi-card">
        <h3>Usuarios</h3>
        <p>{{ summary.totalUsers }}</p>
      </div>

      <div class="kpi-card">
        <h3>Productos</h3>
        <p>{{ summary.totalProducts }}</p>
      </div>

      <div class="kpi-card">
        <h3>Grupos terapéuticos</h3>
        <p>{{ summary.totalGroups }}</p>
      </div>

      <div class="kpi-card">
        <h3>Productos activos</h3>
        <p>{{ summary.activeProducts }}</p>
      </div>

    </div>

    <!-- CHARTS -->
    <div class="grid2">

      <div class="card chart-card">
        <h3>Actividad del sistema</h3>
        <div class="chart">
          <canvas
            baseChart
            [data]="lineChartData"
            [type]="lineChartType"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>

      <div class="card chart-card">
        <h3>Estado de productos</h3>
        <div class="chart">
          <canvas
            baseChart
            [data]="doughnutChartData"
            [type]="doughnutChartType"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>

    </div>

    <!-- 🔥 CATEGORIES (AHORA VA PRIMERO) -->
    <div class="card chart-card">
      <h3>Productos por Categorías</h3>
      <div class="chart">
        <canvas
          baseChart
          [data]="categoriesChartData"
          [type]="barChartType"
          [options]="chartOptions">
        </canvas>
      </div>
    </div>

    <!-- BAR -->
    <div class="card chart-card">
      <h3>Productos por Therapeutic-groups</h3>
      <div class="chart">
        <canvas
          baseChart
          [data]="barChartData"
          [type]="barChartType"
          [options]="chartOptions">
        </canvas>
      </div>
    </div>

  </ng-container>

</div>
